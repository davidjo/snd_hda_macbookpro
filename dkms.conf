PACKAGE_NAME="snd_hda_macbookpro"
PACKAGE_VERSION="0.1"
# install.cirrus.driver.sh hands kernels before 6.17 over to install.cirrus.driver.pre617.sh
PRE_BUILD="install.cirrus.driver.sh -k $kernelver --dkms"
MAKE="make"
# dkms sources this file with $kernelver set to the kernel being built for, so the module
# name and location follow that kernel rather than the one running at install time
# (otherwise a distro kernel update across 6.17 makes the dkms build, and so the kernel install, fail)
# - kernels before 5.13 build snd-hda-codec-cirrus rather than snd-hda-codec-cs8409
# - 6.17 moved the hda sources from sound/pci/hda to sound/hda/codecs/cirrus
case "$kernelver" in
    5.[0-9].*|5.1[0-2].*)
        BUILT_MODULE_NAME[0]="snd-hda-codec-cirrus"
        BUILT_MODULE_LOCATION[0]="build/hda"
        ;;
    [0-5].*|6.[0-9].*|6.1[0-6].*)
        BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
        BUILT_MODULE_LOCATION[0]="build/hda"
        ;;
    *)
        BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
        BUILT_MODULE_LOCATION[0]="build/hda/codecs/cirrus"
        ;;
esac
# according to the man page this option is ignored by many distros (including Fedora and Ubuntu)
# but is apparently still required....why??
DEST_MODULE_LOCATION[0]="/kernel/extra"
AUTOINSTALL="yes"
